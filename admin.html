<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinit — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Pinit Admin</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="password-input" placeholder="••••••••" data-control="control-0" />
    <div class="login-error" id="login-error">Incorrect password</div>
    <button class="btn" data-control="control-1" style="width:100%;">Enter</button>
  </div>
</div>

<!-- Admin Panel -->
<div class="admin" id="admin-panel">
  <div class="topbar">
    <div class="topbar-brand">Pinit <span>Admin</span></div>
    <div class="topbar-stats">
      <div class="tstat">Notes loaded (latest 1,000 max): <strong id="total-notes">—</strong></div>
      <div class="tstat">Countries: <strong id="total-countries">—</strong></div>
      <div class="tstat">Showing: <strong id="showing-count">—</strong></div>
    </div>
    <button class="logout-btn" data-control="control-2">Logout</button>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="search-input" placeholder="Search notes..." data-control="control-3" />
    <select class="filter-select" id="country-filter" data-control="control-4">
      <option value="">All countries</option>
    </select>
    <select class="filter-select" id="status-filter" data-control="control-5">
      <option value="">All notes</option>
      <option value="live">Live only</option>
      <option value="hidden">Hidden only</option>
      <option value="reported">Reported only</option>
    </select>
    <button class="btn" data-control="control-6" style="padding:7px 14px;font-size:12px;">Refresh</button>
    <div class="toolbar-right" id="toolbar-right"></div>
  </div>

  <div class="table-wrap">
    <table class="notes-table">
      <thead>
        <tr>
          <th style="width:16px;"></th>
          <th>Note</th>
          <th>Name</th>
          <th>Mood</th>
          <th>Country</th>
          <th>Status</th>
          <th>Reports</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="notes-tbody"></tbody>
    </table>
    <div id="table-status"></div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3>Delete this note?</h3>
    <p>This cannot be undone. The note will be permanently removed from the wall.</p>
    <div class="confirm-note-preview" id="confirm-preview"></div>
    <div class="confirm-actions">
      <button class="btn-cancel" data-control="control-7">Cancel</button>
      <button class="btn-delete" data-control="control-8">Delete permanently</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script src="/assets/admin.js" defer></script>
</body>
</html>
